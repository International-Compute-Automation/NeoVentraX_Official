name: Deploy Production

# Production deploys ONLY when approved code lands on main.
# No manual workflow_dispatch trigger.
# Production environment approval rules remain enforced.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build artifact stage in Docker
        run: |
          docker build --target artifact -t neoventrax-prod:${{ github.sha }} .

      - name: Extract artifact from Docker
        run: |
          mkdir -p ./artifact

          docker create \
            --name artifact-container \
            neoventrax-prod:${{ github.sha }} \
            /artifact-placeholder

          docker cp artifact-container:/. ./artifact/

          docker rm artifact-container

          cp deploy/ecosystem.prod.cjs ./artifact/ecosystem.config.cjs
          cp deploy/pm2-shared.cjs ./artifact/pm2-shared.cjs

          test -f ./artifact/dist/server/entry.mjs
          test -d ./artifact/dist/client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-prod
          path: ./artifact
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy to Neo Production server
    needs: build

    # Production deployment restricted to main
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'

    # Preserve production environment protection
    environment:
      name: production
      url: https://neoventrax.com

    runs-on: ubuntu-24.04

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifact-prod
          path: ./artifact

      - name: Configure SSH and Cloudflare
        env:
          SSH_KEY: ${{ secrets.NEO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config <<'EOF'
          Host *
            ProxyCommand cloudflared access ssh --hostname %h
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy Production website
        env:
          SSH_USER: ${{ secrets.NEO_SSH_USER }}
          SSH_HOST: ${{ secrets.NEO_SSH_HOST }}
        run: |
          set -euo pipefail

          REMOTE="${SSH_USER}@${SSH_HOST}"

          BASE="/opt/neoventrax/web-deploy/prod"
          RELEASE="${BASE}/releases/${GITHUB_SHA}"

          echo "Deploying Production website to neo..."

          ssh "$REMOTE" "mkdir -p '$RELEASE'"

          rsync -az --delete \
            ./artifact/ \
            "$REMOTE:$RELEASE/"

          ssh "$REMOTE" "
            set -e

            test -f '$RELEASE/dist/server/entry.mjs'
            test -d '$RELEASE/dist/client'

            ln -sfnT '$RELEASE' '$BASE/current'

            sudo -n /usr/local/sbin/nvx-web-activate prod
          "

          echo "Production deployment completed successfully."
